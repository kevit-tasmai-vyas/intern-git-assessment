<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="name">Name :</label>
        <input type="text" name="userName" id="name"/>

        <br><br>

        <label for="fname">Father Name :</label>
        <input type="text" name="userFname" id="fname"/>

        <br><br>

        <label for="age">Age :</label>
        <input type="number" name="userAge" id="age"/>

        <br><br>

        <label for="pass">Password :</label>
        <input type="password" name="userPassword" id="pass"/>

        <br><br>

        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" value="male"/>

        <br><br>

        <label for="female">Female</label>
        <input type="radio" name="gender" id="female" value="female" />
        
        <br><br>

        <label for="other">Other</label>
        <input type="radio" name="gender" id="other" value="other" />
        
        <br><br>

        <label for="c++">C++</label>
        <input type="checkbox" name="language" id="c++" value="c++"/>

        <br><br>

        <label for="java">Java</label>
        <input type="checkbox" name="language" id="java" value="java" />
        
        <br><br>

        <label for="python">Python</label>
        <input type="checkbox" name="language" id="python" value="python" />
        
        <br><br>

        <input type="submit"/>
    </form>
</body>
</html>
