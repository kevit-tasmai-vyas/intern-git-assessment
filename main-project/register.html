<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Create your free DevLearn account and start learning programming.">

    <title>Create Account - DevLearn</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>Create Your DevLearn Account</h1>

    <nav>

        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="courses.html">Courses</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>

    </nav>

</header>


<main>

    <section>

        <h2>Registration Form</h2>

        <form action="#" method="post">

            <fieldset>

                <legend>Account Information</legend>


                <p>

                    <label for="username">
                        Username:
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        minlength="4"
                        maxlength="20"
                        pattern="[A-Za-z0-9_]+"
                        autocomplete="username"
                        placeholder="john_doe"
                        required>

                </p>


                <p>

                    <label for="email">
                        Email:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required>

                </p>


                <p>

                    <label for="password">
                        Password:
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="8"
                        maxlength="30"
                        autocomplete="new-password"
                        required>

                </p>


                <p>

                    <label for="birthdate">
                        Date of Birth:
                    </label>

                    <input
                        type="date"
                        id="birthdate"
                        name="birthdate">

                </p>

            </fieldset>


            <fieldset>

                <legend>Profile Information</legend>


                <p>

                    <label for="age">
                        Age:
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="13"
                        max="100"
                        required>

                </p>


                <p>

                    <label for="color">
                        Favorite Color:
                    </label>

                    <input
                        type="color"
                        id="color"
                        name="color">

                </p>


                <p>

                    <label for="profile-picture">
                        Profile Picture:
                    </label>

                    <input
                        type="file"
                        id="profile-picture"
                        name="profile-picture"
                        accept="image/*">

                </p>

            </fieldset>


            <fieldset>

                <legend>Learning Preferences</legend>


                <p>

                    <label for="language">
                        Preferred Programming Language:
                    </label>

                    <select
                        id="language"
                        name="language"
                        required>

                        <option value="">
                            Choose one
                        </option>

                        <option value="python">
                            Python
                        </option>

                        <option value="java">
                            Java
                        </option>

                        <option value="javascript">
                            JavaScript
                        </option>

                        <option value="cpp">
                            C++
                        </option>

                    </select>

                </p>


                <p>

                    <label for="learning-time">
                        Preferred Learning Time:
                    </label>

                    <input
                        type="time"
                        id="learning-time"
                        name="learning-time">

                </p>


                <p>

                    <label for="start-date">
                        Course Start Date:
                    </label>

                    <input
                        type="datetime-local"
                        id="start-date"
                        name="start-date">

                </p>

            </fieldset>


            <p>

                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    required>

                <label for="terms">
                    I accept the Terms and Conditions.
                </label>

            </p>


            <button type="submit">
                Create Account
            </button>

            <button type="reset">
                Clear Form
            </button>

        </form>

    </section>

</main>


<footer>

    <!-- <hr> -->

    <p>&copy; 2026 DevLearn</p>

</footer>

</body>
</html>
